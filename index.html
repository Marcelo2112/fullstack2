<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <nav class="navbar">

        <div class="tituloNav">
            Titulo web
        </div>

        <div class="menu">

                Inicio

            <a href=""> Formulario</a>

        </div>

    </nav>

    <div class="formularioContenedor">

        <form class="formulariostyle" id="formulario">
            <h1>Registro de usuario</h1>
            <hr style="margin-bottom: 20px;">

            <!-- nombre y apellidp -->
            <div class="fila">
                <div class="campo">
                    <label>Nombre</label>
                    <input type="text" id="nombreInput" placeholder="Duoc">

                </div>
                <div class="campo">
                    <label>Apellido</label>
                    <input type="text" id="apellidoInput" placeholder="UC">

                </div>
            </div>

            <!-- datos de contacto -->


            <div class="fila">
                <div class="campo">
                    <label>Telefono</label>
                    <input type="text" id="telefonoInput" placeholder="+56911112222">
                </div>
                <div class="campo">
                    <label>Pais</label>
                    <select id="paisSelect">
                        <option value=""> Selecione su pais</option>
                        <option value="chile">Chile</option>
                        <option value="peru">Peru</option>
                        <option value="argentina">Argentina</option>
                    </select>
                </div>
            </div>
            <span> si no tienes cuenta <a style="cursor: pointer; color: blue;"> click aca </a> </span>

            <div class="botones">
                <button class="botonGuardar" type="submit">Guardar</button>
            </div>

            <h2> Andres Rama </h2>

        </form>
        <script src="validaciones.js"></script>
    </div>
</body>

</html>
